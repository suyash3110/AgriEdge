<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
<title>AgriEdge — produce quality and trading workflow</title>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="#173a50"/></marker><style>text{font-family:Arial,sans-serif;fill:#173a50}.title{font-size:32px;font-weight:bold}.label{font-size:19px;font-weight:bold}.sub{font-size:16px}.box{fill:#fff;stroke:#bacbd3;stroke-width:2}.green{fill:#e8f4eb;stroke:#3b8053;stroke-width:2}.line{fill:none;stroke:#173a50;stroke-width:2;marker-end:url(#arrow)}</style></defs>
<rect width="1400" height="900" fill="#f5f8fa"/>
<text x="55" y="65" class="title">AgriEdge • From crop photo to agreed trade</text>
<text x="55" y="99" class="sub">Nagpur, Maharashtra • English / हिंदी / मराठी • Editable SVG: shapes, arrows and text</text>
<g id="farmer"><rect x="55" y="145" width="260" height="110" rx="12" class="green"/><text x="80" y="184" class="label">Farmer / FPO listing</text><text x="80" y="214" class="sub">Crop, owner, weight, dates</text><text x="80" y="238" class="sub">Upload crop photograph</text></g>
<g id="validation"><rect x="365" y="145" width="280" height="110" rx="12" class="box"/><text x="390" y="184" class="label">Validate and preprocess</text><text x="390" y="214" class="sub">JPEG / PNG, file-size checks</text><text x="390" y="238" class="sub">Image orientation and resize</text></g>
<g id="model"><rect x="695" y="145" width="280" height="110" rx="12" class="box"/><text x="720" y="184" class="label">Local trained crop model</text><text x="720" y="214" class="sub">Dataset-specific classification</text><text x="720" y="238" class="sub">Saved artifact checksum checked</text></g>
<g id="grade"><rect x="1025" y="145" width="320" height="110" rx="12" class="green"/><text x="1050" y="184" class="label">Provisional appearance grade</text><text x="1050" y="214" class="sub">A / B / C with photo and source</text><text x="1050" y="238" class="sub">Unsupported crops → FPO review</text></g>
<path class="line" d="M315 200H365"/><path class="line" d="M645 200H695"/><path class="line" d="M975 200H1025"/>
<g id="review"><rect x="1025" y="320" width="320" height="120" rx="12" class="box"/><text x="1050" y="359" class="label">Farmer disagrees with grade?</text><text x="1050" y="391" class="sub">FPO inspects and revises grade</text><text x="1050" y="417" class="sub">Reason and assessment preserved</text></g>
<path class="line" d="M1185 255V320"/>
<g id="buyer"><rect x="695" y="320" width="280" height="120" rx="12" class="green"/><text x="720" y="359" class="label">Buyer reviews produce</text><text x="720" y="391" class="sub">Grade, photo, price, trust score</text><text x="720" y="417" class="sub">Places offer or requests circle</text></g>
<path class="line" d="M1025 380H975"/>
<g id="circle"><rect x="365" y="320" width="280" height="120" rx="12" class="box"/><text x="390" y="359" class="label">Optional Harvest Circle</text><text x="390" y="391" class="sub">Select compatible farmer lots</text><text x="390" y="417" class="sub">Each farmer accepts or rejects</text></g>
<path class="line" d="M695 380H645"/>
<g id="trade"><rect x="55" y="320" width="260" height="120" rx="12" class="green"/><text x="80" y="359" class="label">Seller accepts offer</text><text x="80" y="391" class="sub">Agreement and reserved stock</text><text x="80" y="417" class="sub">Buyer/seller conversation</text></g>
<path class="line" d="M365 380H315"/>
<g id="tolerance"><rect x="55" y="515" width="355" height="125" rx="12" class="green"/><text x="80" y="553" class="label">Mutual tolerance allowance</text><text x="80" y="584" class="sub">Either party proposes extra ₹ / quintal</text><text x="80" y="611" class="sub">Other party accepts → total recalculated</text></g>
<path class="line" d="M185 440V515"/>
<g id="delivery"><rect x="465" y="515" width="280" height="125" rx="12" class="box"/><text x="490" y="553" class="label">Transport and inspection</text><text x="490" y="584" class="sub">Quote, assignment, pickup</text><text x="490" y="611" class="sub">Delivery and buyer inspection</text></g>
<path class="line" d="M410 577H465"/>
<g id="payment"><rect x="800" y="515" width="280" height="125" rx="12" class="box"/><text x="825" y="553" class="label">Payment and records</text><text x="825" y="584" class="sub">Payment order locks tolerance</text><text x="825" y="611" class="sub">Transaction, dispute and audit</text></g>
<path class="line" d="M745 577H800"/>
<rect x="55" y="700" width="1290" height="140" rx="12" fill="#173a50"/>
<text x="85" y="739" style="fill:white;font: bold 21px Arial">Independent application services</text>
<text x="85" y="776" style="fill:white;font:17px Arial">Windows launcher + process supervisor  •  Next.js application + database  •  Local Python crop inference</text>
<text x="85" y="809" style="fill:white;font:17px Arial">Gemini assistant with local fallback  •  Search-grounded, dated market records when provider quota is available</text>
<text x="55" y="877" class="sub">Appearance grades do not measure hidden contamination. Model predictions never substitute for live market observations.</text>
</svg>
